<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f1">
<title>곁에 — 건강 도우미</title>
<style>
:root{
  --ink:#16261f; --sub:#4a5a52; --bg:#f7f6f1; --card:#ffffff; --line:#cdd6d0;
  --green:#14614a; --green-soft:#e6f1eb; --red:#b3261e; --red-soft:#fdecea; --red-line:#efb9b3;
  --amber-soft:#fff5d9; --amber-line:#e7c35a; --focus:#f0a020;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:24px;line-height:1.5;word-break:keep-all}
body.xl{font-size:28px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
a{color:inherit}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px;border-radius:12px}
h1{font-size:1.3em;line-height:1.3;margin:0 0 20px;letter-spacing:-.5px}
h1:focus{outline:none}
h2{font-size:1.05em;margin:28px 0 12px}
p{margin:0 0 16px}

/* 상단 */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--line)}
.brand{font-size:26px;font-weight:800;letter-spacing:-1px}
.brand small{font-size:15px;font-weight:700;color:var(--green);background:var(--green-soft);padding:2px 8px;border-radius:6px;margin-left:8px;vertical-align:middle;letter-spacing:0}
.call119{display:inline-flex;align-items:center;gap:6px;min-height:56px;padding:0 20px;border-radius:28px;background:var(--red);color:#fff;font-weight:800;font-size:24px;text-decoration:none}

.wrap{max-width:480px;margin:0 auto;padding:22px 16px 60px}
.row.big{min-height:120px;font-size:1.25em;line-height:1.3}
.row.big .emo{font-size:48px;width:56px}
.linkbtn{display:block;margin:26px auto 0;min-height:60px;padding:8px 16px;font-weight:700;color:var(--sub);text-decoration:underline;text-underline-offset:6px}
.nextmed{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:26px}
.nextmed .t{flex:1;font-weight:800;line-height:1.35}
.nextmed .t small{display:block;font-size:20px;color:var(--sub);font-weight:700}
.nextmed button{flex:none;min-height:64px;padding:0 18px;border-radius:14px;background:var(--green);color:#fff;font-weight:800}
.btn-white.btn-big{border-width:3px}

/* 지도 */
.map{width:100%;height:min(300px,36vh);border-radius:18px;border:2px solid var(--line);background:#e6ebe7;margin-bottom:16px;overflow:hidden}
.ov{background:#fff;border:3px solid var(--green);border-radius:12px;padding:4px 10px;font-size:18px;font-weight:800;white-space:nowrap;color:var(--ink);box-shadow:0 2px 8px #0002}
.seasrc{display:block;margin-top:8px;font-size:17px;color:var(--sub);font-weight:700}
.btn-amber{background:var(--amber-soft);border:3px solid #b45309;color:#7a3a00;font-weight:900}
.place .savebtn{margin:10px 0 0;min-height:68px;width:100%}
.place .saved{margin-top:10px;padding:12px;border-radius:12px;background:var(--green-soft);color:var(--green);font-weight:900;text-align:center}
.ov.me{border-color:#1a5fb4;color:#1a5fb4}
.place{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:12px}
.place b{display:block;font-size:1.05em}
.place .meta{font-size:20px;color:var(--sub);font-weight:700;margin-bottom:12px}
.place .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.place .two .btn{min-height:64px;margin:0}

/* 목록 버튼 */
.list{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:16px;width:100%;min-height:80px;padding:14px 18px;background:var(--card);border:2px solid var(--line);border-radius:18px;text-align:left;font-weight:750;font-size:1.05em}
.row .emo{font-size:36px;line-height:1;width:44px;text-align:center;flex:none}
.row .label{flex:1}
.row .go{font-size:36px;color:#8a9a92;font-weight:400}
.row:active{background:var(--green-soft)}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:76px;padding:14px 18px;border-radius:18px;font-weight:800;font-size:1em;text-decoration:none;text-align:center}
.btn + .btn{margin-top:12px}
.btn-green{background:var(--green);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-white{background:var(--card);border:2px solid var(--line)}
.btn-big{min-height:96px;font-size:1.15em}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6}

.note{font-size:20px;color:var(--sub);margin-top:22px}
.box{border-radius:18px;padding:18px 20px;margin-bottom:18px}
.box-red{background:var(--red-soft);border:2px solid var(--red-line)}
.box-amber{background:var(--amber-soft);border:2px solid var(--amber-line)}
.box-green{background:var(--green-soft);border:2px solid #bcd8c9}
.box ul{margin:0;padding-left:1.1em}
.box li{margin:6px 0;font-weight:700}
.tag{display:inline-block;font-size:17px;font-weight:700;color:var(--green);background:var(--green-soft);padding:2px 8px;border-radius:6px;vertical-align:middle}

/* 흐름 화면 */
#flow{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
#flow[hidden]{display:none}
.flow-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:6px;min-height:56px;padding:0 18px;border-radius:28px;background:var(--card);border:2px solid var(--line);font-weight:800}
.count{font-size:22px;font-weight:800;color:var(--green);margin-bottom:6px}
.step{font-size:1.25em;font-weight:800;line-height:1.45;margin:0 0 28px}
.steps{margin:0 0 20px;padding-left:1.3em}
.steps li{margin:0 0 14px;font-weight:700;line-height:1.45}
.dont li{list-style:none;margin-left:-1.3em}
.dont li::before{content:"✕ ";color:var(--red);font-weight:900}
.speak{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:60px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-weight:700;margin-bottom:12px}
.quote{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;font-weight:800;margin-bottom:18px}
textarea,input[type=text],input[type=number]{display:block;width:100%;min-height:72px;border:2px solid #a8b8ae;border-radius:16px;background:#fff;padding:14px 16px;font-size:1em}
textarea{min-height:150px;resize:vertical}
label.field{display:block;font-weight:800;margin:22px 0 10px}
.summary dt{font-size:20px;color:var(--sub);font-weight:700;margin-top:10px}
.summary dd{margin:0 0 4px;font-weight:800}

/* 약 */
.med{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.med .when{font-size:1.15em;font-weight:900}
.med .name{font-weight:700;margin:2px 0 14px}
.med.done{border-color:#bcd8c9;background:var(--green-soft)}
.med.done .btn{background:transparent;color:var(--green);border:2px solid #bcd8c9}

/* 선택 칩 */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:60px;padding:10px 18px;border-radius:30px;border:2px solid var(--line);background:var(--card);font-weight:750}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.chip[aria-pressed="true"]::before{content:"✓ "}

.contact{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:12px}
.contact b{display:block;font-size:1em}
.contact span{font-size:20px;color:var(--sub)}
.contact button{flex:none;min-height:60px;padding:0 18px;border-radius:14px;background:var(--green);color:#fff;font-weight:800}

/* 하단 메뉴 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{display:grid;grid-template-columns:repeat(3,1fr);max-width:480px;margin:0 auto;padding:8px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:76px;border-radius:16px;font-weight:750;font-size:21px;color:var(--sub)}
.tab .emo{font-size:28px;line-height:1}
.tab[aria-current="page"]{background:var(--green-soft);color:var(--green);font-weight:900}
.page[hidden]{display:none}

.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:50;max-width:calc(100vw - 32px);width:max-content;padding:14px 20px;border-radius:16px;background:var(--ink);color:#fff;font-size:21px;font-weight:700;box-shadow:0 6px 24px #0003}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:350px){body{font-size:22px}.row .emo{font-size:30px;width:36px}.call119{padding:0 14px}}

/* ===== 글자만으로 크고 또렷하게 ===== */
body{font-size:26px}
body.xl{font-size:30px}
h1{font-size:1.45em;font-weight:900;letter-spacing:-1px;margin-bottom:22px}
h2{font-size:1.1em;font-weight:900;color:var(--sub);margin:32px 0 14px}
.brand{font-size:28px;font-weight:900}
.call119{min-height:62px;padding:0 22px;font-size:27px;font-weight:900;letter-spacing:-.5px}
.row{min-height:96px;padding:18px 22px;border-width:3px;font-size:1.3em;font-weight:900;letter-spacing:-.5px;line-height:1.3}
.row .go{font-size:48px;font-weight:300;color:#7b8c84}
.row.big{min-height:156px;font-size:1.7em;letter-spacing:-1px;line-height:1.25;border-color:#9fb2a7}
.btn{min-height:86px;font-size:1.2em;font-weight:900;letter-spacing:-.5px}
.btn-big{min-height:110px;font-size:1.4em;letter-spacing:-1px}
.btn-white{border-width:3px;border-color:#9fb2a7}
.nextmed{padding:18px 20px;border-width:3px;flex-direction:column;align-items:stretch;gap:12px}
.nextmed button{width:100%}
.nextmed .t{font-size:1.1em;font-weight:900}
.nextmed .t small{font-size:22px;font-weight:800}
.nextmed button{min-height:72px;padding:0 20px;font-size:1.05em;font-weight:900}
.linkbtn{font-size:24px;font-weight:800;min-height:68px}
.step{font-size:1.45em;font-weight:900;letter-spacing:-.5px}
.count{font-size:26px;font-weight:900}
.steps li,.box li{font-weight:800}
.speak{min-height:72px;font-size:1.05em;font-weight:900;border-width:3px}
.chip{min-height:70px;padding:10px 22px;font-size:1.05em;font-weight:900;border-width:3px}
.contact{border-width:3px}
.contact b{font-size:1.15em;font-weight:900}
.contact button{min-height:70px;padding:0 22px;font-size:1.05em;font-weight:900}
.person{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:14px}
.person b{display:block;font-size:1.2em;font-weight:900}
.person .who{font-size:22px;font-weight:800;color:var(--sub)}
.person .num{font-size:1.15em;font-weight:900;letter-spacing:.5px;margin:4px 0 14px}
.person .num.empty{color:var(--red);font-size:1em}
.person .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.person .two .btn{min-height:76px;margin:0;font-size:1.05em}
input[type=tel]::placeholder{font-weight:600;color:#8a958f}
input[type=tel]{display:block;width:100%;min-height:84px;border:3px solid #9fb2a7;border-radius:16px;background:#fff;padding:14px 18px;font-size:1.3em;font-weight:900;letter-spacing:1px}
.place{border-width:3px}
.place b{font-size:1.15em;font-weight:900}
.place .two .btn{min-height:72px;font-size:1.05em}
.back{min-height:62px;font-size:1.05em;font-weight:900;border-width:3px}
.ov{font-size:20px;font-weight:900}
@media (max-width:350px){body{font-size:23px}.row.big{font-size:1.5em}}

/* ===== 꽉 채우는 고대비 화면 ===== */
:root{--hurt:#b45309;--sick:#1d4ed8;--voice:#14614a;--write:#334155}
.wrap{padding-bottom:124px}
#flowBody{padding-bottom:124px}
.top{padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.topinfo{min-height:60px;padding:0 20px;border-radius:14px;background:#fff;border:3px solid var(--ink);font-size:24px;font-weight:900}
.sosbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;align-items:center;justify-content:center;min-height:88px;padding-bottom:env(safe-area-inset-bottom);background:var(--red);color:#fff;font-size:34px;font-weight:900;letter-spacing:-.5px;text-decoration:none;box-shadow:0 -4px 18px #0004}
.sosbar:active{background:#8f1d17}
.home{display:block}
.home h1{font-size:30px;margin:4px 0 12px}
.home h2{margin:22px 0 10px}
.home .nextmed{margin-bottom:0;padding:14px 16px}
.home .nextmed .t{font-size:1em}
.tiles{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;height:max(320px,calc(100dvh - 82px - 70px - 88px - 34px))}
.tile{display:flex;align-items:center;justify-content:center;text-align:center;min-height:150px;padding:10px;border-radius:20px;color:#fff;font-size:34px;font-weight:900;line-height:1.22;letter-spacing:-1px;box-shadow:inset 0 -7px 0 #0003}
.tile:active{filter:brightness(.85);transform:translateY(2px)}
.t-hurt{background:var(--hurt)}.t-sick{background:var(--sick)}.t-voice{background:var(--voice)}.t-write{background:var(--write)}
.calls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.call{min-height:100px;padding:8px 4px;border-radius:16px;background:#fff;border:3px solid var(--ink);font-size:22px;font-weight:900;line-height:1.25;letter-spacing:-.5px}
.call small{display:block;margin-top:4px;font-size:20px;font-weight:900;color:var(--green)}
.call.empty small{color:var(--red)}
.infobar{width:100%;min-height:76px;margin-top:10px;border-radius:16px;background:#e7ece8;border:3px solid #8fa398;font-size:25px;font-weight:900}
.home .note{margin-top:14px}
.flow-top{padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.back.wide{display:flex;width:100%;justify-content:center;min-height:74px;font-size:28px;border:3px solid var(--ink);border-radius:16px}
/* 고르는 화면: 같은 색 칸으로 화면을 채움 */
.list.fillv{display:flex;flex-direction:column;gap:10px;min-height:calc(100dvh - 96px - 88px - 150px)}
.list.fillv .row{flex:1}
.row.fill{color:#fff;border:0;box-shadow:inset 0 -6px 0 #0003;font-size:1.35em}
.row.fill .go{color:#fff;opacity:.9}
.row.f-hurt{background:var(--hurt)}.row.f-sick{background:var(--sick)}
.tiles.two{height:auto;grid-template-rows:130px;margin-top:10px}
.tiles.two .tile{min-height:130px;font-size:30px}
.err{margin:10px 0 0;color:var(--red);font-size:24px;font-weight:900}
.err:empty{display:none}
@media (max-width:350px){.tile{font-size:28px}.call{font-size:19px}.call small{font-size:17px}.sosbar{font-size:30px}}

/* ===== 한 화면에 담기 + 버튼 안을 글자로 채우기 ===== */
:root{--toph:74px;--flowh:84px;--barh:84px}
.top{height:var(--toph);padding-top:8px;padding-bottom:8px}
.topinfo{min-height:56px}
.sosbar{min-height:var(--barh);font-size:36px}
.wrap{padding-top:12px}
body[data-page="help"] .wrap{padding-bottom:calc(var(--barh) + 8px)}
.home{display:flex;flex-direction:column;gap:10px;height:calc(100dvh - var(--toph) - var(--barh) - 20px)}
.home h1{font-size:28px;margin:0}
.tiles{flex:1;min-height:0;height:auto}
.tile{container-type:size;padding:6px;min-height:0;font-size:inherit}
.tile span{display:block;font-size:min(21cqw, 30cqh, 56px);line-height:1.15;letter-spacing:-.03em}
.calls{margin:0}
.call{min-height:0;height:88px;font-size:24px;line-height:1.2}
.call small{font-size:21px}
.home .nextmed{flex-direction:row;align-items:center;margin:0;padding:10px 12px;gap:10px;border-width:3px}
.home .nextmed .t{font-size:24px;line-height:1.25}
.home .nextmed .t small{font-size:20px}
.home .nextmed button{width:auto;min-height:68px;padding:0 18px;font-size:26px}

.flow-top{height:var(--flowh);padding-top:8px;padding-bottom:8px}
.back.wide{min-height:66px}
#flowBody{padding:12px 16px calc(var(--barh) + 12px)}
.fit{display:flex;flex-direction:column;gap:10px;min-height:calc(100dvh - var(--flowh) - var(--barh) - 24px)}
.fit h1{margin:0;font-size:32px;line-height:1.2}
.fit .grow{flex:1;min-height:0}
.fit .grow.center{display:flex;flex-direction:column;justify-content:center}
.fit .btn{margin:0}
.fit .btn + .btn{margin-top:0}
.fit .box{margin:0}
.q{margin:0 0 8px;font-size:28px;font-weight:900}
.hint{margin:0;font-size:26px;font-weight:900;color:var(--green)}
.down{margin:0;font-size:26px;font-weight:900;color:var(--red)}
.h119{color:var(--red)}
.box.tight{padding:12px 16px}
.box.tight li,.steps.tight li{margin:4px 0;font-size:26px;line-height:1.35}
.steps.tight{margin:0;padding-left:1.2em}
.speak.sm{min-height:58px;margin:0;font-size:24px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn .btn{min-height:120px;font-size:40px;letter-spacing:-1px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair .btn{min-height:96px;font-size:26px;line-height:1.25}
.stack3{display:flex;flex-direction:column;gap:10px}
.stack3 .btn{flex:1;min-height:90px;font-size:38px}
.fit .step{margin:0;font-size:38px;line-height:1.35}
.fit .count{font-size:28px}
.fit textarea{min-height:150px;font-size:28px;font-weight:700}
.fit .tile.grow{min-height:220px}
.fit > .tile span{font-size:min(16cqw, 22cqh, 64px)}
.summary dd{font-size:28px}
/* 고르는 목록: 글자로 칸을 채움 */
.list.fillv{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.list.fillv .row{flex:1;min-height:70px;padding:6px 18px;container-type:inline-size}
.row.fill .go{display:none}
.row.fill .label{font-size:min(10cqw, 46px);line-height:1.15;letter-spacing:-.03em}
.tiles.two{height:auto;grid-template-rows:118px;margin:0}
.tiles.two .tile span{font-size:min(17cqw, 30cqh, 40px)}
@media (max-height:640px){.call{height:76px}.yn .btn{min-height:100px;font-size:34px}.fit .step{font-size:32px}}

/* 2차 조정: 작은 화면에서도 스크롤 줄이기 */
.qrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qrow .q{margin:0;flex:1}
.speak.mini{flex:none;width:auto;min-height:56px;margin:0;padding:0 16px;font-size:22px;border-width:3px}
.fit .btn-big{min-height:96px}
.yn .btn{min-height:104px}
.pair .btn{min-height:84px}
.waitbtn{min-height:120px;font-size:34px;line-height:1.25}
.tiles.two{grid-template-rows:100px}
.fit h1{font-size:30px}
.box.tight li,.steps.tight li{font-size:25px;margin:2px 0}
.summary dt{margin-top:4px;font-size:19px}
.summary dd{font-size:26px}
.quote{padding:12px 16px}
@media (max-width:360px){
  .fit h1{font-size:27px}.q{font-size:24px}.hint,.down{font-size:23px}
  .box.tight li,.steps.tight li{font-size:22px}
  .yn .btn{font-size:34px;min-height:92px}
  .fit .step{font-size:30px}
  .call{font-size:20px}.call small{font-size:18px}
  .pair .btn{font-size:22px}
  .waitbtn{font-size:28px}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">곁에<small>시범</small></div>
  <button class="topinfo" onclick="go('me')">내 정보</button>
</header>

<main class="wrap">

  <!-- 첫 화면: 화면을 꽉 채우는 큰 칸 -->
  <section class="page home" id="help">
    <h1 tabindex="-1">무슨 일이 있으세요?</h1>
    <div class="tiles">
      <button class="tile t-hurt" onclick="openMenu('hurt')"><span>다쳤어요<br>물렸어요</span></button>
      <button class="tile t-sick" onclick="openMenu('sick')"><span>몸이<br>아파요</span></button>
      <button class="tile t-voice" onclick="startVoice()"><span>말로<br>설명하기</span></button>
      <button class="tile t-write" onclick="openWrite()"><span>글로<br>설명하기</span></button>
    </div>
    <div class="calls" id="quickCalls" aria-label="바로 전화"></div>
    <div id="nextMed"></div>
  </section>

  <!-- 내 정보 · 약 · 연락처 -->
  <section class="page" id="me" hidden>
    <button class="back wide" style="margin-bottom:18px" onclick="go('help')">← 처음 화면으로</button>
    <h1 tabindex="-1">내 정보 · 약 · 연락처</h1>

    <h2>전화할 곳</h2>
    <div id="contactList"></div>
    <p class="note" style="margin-top:4px">번호는 이 휴대폰에만 저장돼요.</p>
    <button class="btn btn-white btn-big" onclick="openMap()">가까운 의료기관 지도</button>

    <h2>배 예보</h2>
    <div id="seaBox" class="box box-green" role="note"><b>배 예보를 확인하고 있어요…</b></div>
    <h2>오늘 드실 약</h2>
    <div id="medList"></div>
    <button class="btn btn-white btn-big" onclick="openAddMed()">＋ 약 추가하기</button>

    <h2>앓고 있는 병</h2>
    <div class="chips" data-group="conds">
      <button class="chip" aria-pressed="false">고혈압</button>
      <button class="chip" aria-pressed="false">당뇨</button>
      <button class="chip" aria-pressed="false">심장병</button>
      <button class="chip" aria-pressed="false">뇌졸중</button>
      <button class="chip" aria-pressed="false">관절·허리</button>
      <button class="chip" aria-pressed="false">치매</button>
    </div>

    <h2>먹는 약</h2>
    <div class="chips" data-group="drugs">
      <button class="chip" aria-pressed="false">혈압약</button>
      <button class="chip" aria-pressed="false">당뇨약</button>
      <button class="chip" aria-pressed="false">피 묽게 하는 약</button>
      <button class="chip" aria-pressed="false">진통제</button>
    </div>

    <h2>알레르기</h2>
    <div class="chips" data-group="allergy">
      <button class="chip" aria-pressed="false">벌</button>
      <button class="chip" aria-pressed="false">약</button>
      <button class="chip" aria-pressed="false">음식</button>
    </div>

    <h2>글자 크기</h2>
    <button class="btn btn-white btn-big" id="sizeBtn" aria-pressed="false" onclick="toggleSize()">글자 더 크게</button>

    <p class="note">고른 병·약·알레르기는 응급 안내에 쓰여요. 이 화면에서만 쓰고 저장하지 않아요.</p>
  </section>
</main>

<!-- 단계별 안내 화면 -->
<div id="flow" hidden role="dialog" aria-modal="true" aria-labelledby="flowTitle">
  <div class="flow-top">
    <button class="back wide" onclick="back()">← 뒤로 가기</button>
  </div>
  <div class="wrap" id="flowBody"></div>
</div>

<!-- 어느 화면에서나 맨 아래: 119 -->
<a class="sosbar" href="tel:119" aria-label="119에 전화하기">119 전화하기</a>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 내 정보 상태 (메모리에만) ---------- */
const me = { conds:new Set(), drugs:new Set(), allergy:new Set() };
document.querySelectorAll('.chips').forEach(group => {
  group.addEventListener('click', e => {
    const chip = e.target.closest('.chip'); if (!chip) return;
    const on = chip.getAttribute('aria-pressed') !== 'true';
    chip.setAttribute('aria-pressed', String(on));
    const set = me[group.dataset.group];
    on ? set.add(chip.textContent.trim()) : set.delete(chip.textContent.trim());
  });
});
function toggleSize(){
  const on = document.body.classList.toggle('xl');
  $('sizeBtn').setAttribute('aria-pressed', String(on));
  $('sizeBtn').textContent = on ? '글자 원래대로' : '글자 더 크게';
}

/* ---------- 공통 ---------- */
let toastTimer;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true, 3500); }
function go(page){
  document.body.dataset.page = page;
  document.querySelectorAll('.page').forEach(p => p.hidden = p.id !== page);
  window.scrollTo(0,0);
  const h = document.querySelector('#'+page+' h1'); if (h) h.focus();
}
function demoCall(who){ toast(who + ' 번호는 시범이라 연결되지 않아요'); }

/* ---------- 연락처: 보건진료소 · 이장님 · 가족 번호 지정 ---------- */
const CONTACT_KEY = 'gyeote_contacts_v1';
const contacts = {
  clinic: { label:'보건진료소', name:'섬마을 보건진료소', tel:'' },
  chief:  { label:'이장님',     name:'○○리 이장',        tel:'' },
  family: { label:'가족',       name:'큰딸',              tel:'' }
};
try {
  const saved = JSON.parse(localStorage.getItem(CONTACT_KEY) || '{}');
  for (const k in contacts) if (saved[k]) Object.assign(contacts[k], { name: saved[k].name || contacts[k].name, tel: saved[k].tel || '' });
} catch(e) {}
function saveContacts(){
  try { localStorage.setItem(CONTACT_KEY, JSON.stringify(contacts)); } catch(e) { toast('이 기기에서는 저장이 안 돼서 이번에만 쓸게요'); }
}
const digits = t => String(t || '').replace(/\D/g, '');
function prettyTel(t){
  const d = digits(t);
  if (d.length === 11) return d.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
  if (d.length === 10) return d.startsWith('02') ? d.replace(/(\d{2})(\d{4})(\d{4})/, '$1-$2-$3') : d.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
  if (d.length === 9 && d.startsWith('02')) return d.replace(/(\d{2})(\d{3})(\d{4})/, '$1-$2-$3');
  if (d.length === 8) return d.replace(/(\d{4})(\d{4})/, '$1-$2');
  return d;
}
function renderContacts(){
  $('quickCalls').innerHTML = Object.entries(contacts).map(([k, c]) =>
    `<button class="call${c.tel ? '' : ' empty'}" onclick="callContact('${k}')">${esc(c.label)}<small>${c.tel ? '전화하기' : '번호 넣기'}</small></button>`).join('');
  $('contactList').innerHTML = Object.entries(contacts).map(([k, c]) => `
    <div class="person">
      <b>${esc(c.label)}</b>
      <div class="who">${esc(c.name)}</div>
      ${c.tel ? `<div class="num">${esc(prettyTel(c.tel))}</div>` : `<div class="num empty">번호가 아직 없어요</div>`}
      <div class="two">
        <button class="btn btn-green" onclick="callContact('${k}')">전화</button>
        <button class="btn btn-white" onclick="editContact('${k}')">${c.tel ? '번호 바꾸기' : '번호 넣기'}</button>
      </div>
    </div>`).join('');
}
function callContact(k){
  const c = contacts[k];
  if (!c.tel) { toast('먼저 ' + c.label + ' 번호를 넣어 주세요'); editContact(k, !$('flow').hidden); return; }
  location.href = 'tel:' + digits(c.tel);
}
let editFromFlow = false;
function editContact(k, fromFlow){
  editFromFlow = !!fromFlow;
  if (!fromFlow) stack.length = 0;
  push(() => {
    const c = contacts[k];
    show(`
      <h1>${esc(c.label)} 번호</h1>
      <label class="field" for="cName">이름</label>
      <input id="cName" type="text" maxlength="20" value="${esc(c.name)}" autocomplete="off">
      <label class="field" for="cTel">전화번호</label>
      <input id="cTel" type="tel" inputmode="tel" autocomplete="tel" maxlength="16" placeholder="010-1234-5678" value="${esc(prettyTel(c.tel))}" aria-describedby="cTelErr">
      <p class="err" id="cTelErr" role="alert"></p>
      <button class="btn btn-green btn-big" style="margin-top:24px" onclick="saveContact('${k}')">저장하기</button>
      ${c.tel ? `<button class="btn btn-white" onclick="clearContact('${k}')">번호 지우기</button>` : ''}
      <p class="note">번호는 이 휴대폰에만 저장돼요. 응급 화면의 "알리기"와 "전화" 버튼이 이 번호로 연결돼요.</p>
    `);
  });
}
function saveContact(k){
  const tel = digits($('cTel').value), name = $('cName').value.trim();
  if (tel.length < 8 || tel.length > 12) { $('cTelErr').textContent = '번호가 맞지 않아요. 예: 010-1234-5678'; $('cTel').focus(); return; }
  contacts[k].tel = tel; if (name) contacts[k].name = name;
  saveContacts(); renderContacts(); afterEdit(); toast(contacts[k].label + ' 번호를 저장했어요');
}
function clearContact(k){
  contacts[k].tel = ''; saveContacts(); renderContacts(); afterEdit(); toast('번호를 지웠어요');
}
/* 응급 화면에서 번호를 넣었으면 그 화면으로 돌아가고, 아니면 내 정보로 */
function afterEdit(){
  if (editFromFlow && stack.length > 1) { back(); }
  else { closeFlow(); go('me'); }
}

/* 읽어주기 */
function speak(text){
  if (!('speechSynthesis' in window)) { toast('이 기기에서는 읽어주기를 쓸 수 없어요'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; u.rate = 0.85;
  speechSynthesis.speak(u);
}
function stopSpeak(){ if ('speechSynthesis' in window) speechSynthesis.cancel(); }
let lastSpeech = '';
function qrow(q, text){ lastSpeech = text; return `<div class="qrow"><p class="q">${esc(q)}</p><button class="speak mini" onclick="speak(lastSpeech)">듣기</button></div>`; }
function speakBtn(text){ lastSpeech = text; return `<button class="speak sm" onclick="speak(lastSpeech)">소리로 듣기</button>`; }

/* 흐름 화면: 쌓아 두었다가 뒤로 */
const stack = [];
function show(html){
  stopSpeak();
  $('flowBody').innerHTML = html;
  $('flow').hidden = false;
  document.body.style.overflow = 'hidden';
  $('flow').scrollTop = 0;
  const h = $('flowBody').querySelector('h1'); if (h){ h.id='flowTitle'; h.setAttribute('tabindex','-1'); h.focus(); }
}
function push(fn){ stack.push(fn); fn(); }
function back(){ stack.pop(); if (stack.length) stack[stack.length-1](); else closeFlow(); }
function closeFlow(){ stopSpeak(); stack.length=0; $('flow').hidden=true; document.body.style.overflow=''; }
function home(){ closeFlow(); go('help'); }

/* ---------- 사고별 안내 (소방청·지자체 소방 안내 기준) ---------- */

    wait:['편하게 누우세요. 숨이 차면 앉으세요.','꽉 끼는 옷을 풀어 주세요.','처방받은 응급 주사(에피펜)가 있으면 바로 쓰세요.'],
    steps:[
      '벌이 있는 곳에서 멀리 떨어지세요.',

    ],
    dont:['손가락이나 족집게로 침을 짜내지 마세요','벌집을 직접 건드리지 마세요. 119에 신고하세요']
  },
  cut: {

    wait:['깨끗한 천으로 상처를 계속 세게 누르세요.','잘린 부분은 깨끗한 천에 싸서 비닐에 넣으세요. 그 비닐을 얼음물에 담가 함께 가져가세요. 얼음에 직접 닿으면 안 돼요.'],
    steps:[
      '깨끗한 천이나 수건으로 상처를 꾹 누르세요.',
      '10분 동안 떼지 말고 계속 누르세요. 다친 곳을 가슴보다 높이 드세요.',

    ],
    dont:['흙, 된장, 담뱃가루를 바르지 마세요','피가 나는 동안 자꾸 들춰 보지 마세요']
  },
  fall: {

    ],
    dont:['아픈 곳을 억지로 움직이거나 펴지 마세요','괜찮겠지 하고 미루지 마세요']
  },
  heat: {
    title:'더위를 먹었어요',
    danger:['정신이 흐리거나 헛소리를 해요','몸이 아주 뜨거운데 땀이 안 나요','쓰러졌거나 몸이 떨리며 굳어요'],
    dangerTitle:'열사병일 수 있어요',
    wait:['그늘이나 시원한 곳으로 옮기세요.','옷을 느슨하게 풀어 주세요.','젖은 수건, 찬물, 부채로 몸을 계속 식혀 주세요.','정신이 흐리면 억지로 물을 먹이지 마세요.'],
    steps:[
      '그늘이나 시원한 곳으로 가서 쉬세요.',

    ],
    dont:['한낮(12시~5시)에 다시 밭일을 나가지 마세요','술은 드시지 마세요']
  }
};

/* 두 번째 화면: 고를 것 */
function rowBtn(cls, label, act){ return `<button class="row fill ${cls}" onclick="${act}"><span class="label">${label}</span><span class="go" aria-hidden="true">›</span></button>`; }
function openMenu(kind){
  stack.length = 0;
  if (kind === 'hurt') push(() => show(`
    <div class="fit"><h1>어떻게 다치셨어요?</h1>
    <div class="list fillv">
      ${rowBtn('f-hurt','뱀에 물렸어요',"openGuide('snake',true)")}
      ${rowBtn('f-hurt','벌에 쏘였어요',"openGuide('bee',true)")}
      ${rowBtn('f-hurt','베이거나 찔렸어요',"openGuide('cut',true)")}
      ${rowBtn('f-hurt','넘어졌어요',"openGuide('fall',true)")}
      ${rowBtn('f-hurt','더위를 먹었어요',"openGuide('heat',true)")}
    </div></div>`));
  else push(() => show(`
    <div class="fit"><h1>어디가 아프세요?</h1>
    <div class="list fillv">
      ${rowBtn('f-sick','열이 나요',"startSymptom('열이 나요',true)")}
      ${rowBtn('f-sick','배가 아파요',"startSymptom('배가 아파요',true)")}
      ${rowBtn('f-sick','기침이 나요',"startSymptom('기침이 나요',true)")}
      ${rowBtn('f-sick','어지러워요',"startSymptom('어지러워요',true)")}
    </div>
    <div class="tiles two">
      <button class="tile t-voice" onclick="startVoice(true)"><span>다른 곳은<br>말로</span></button>
      <button class="tile t-write" onclick="openWrite('',true)"><span>다른 곳은<br>글로</span></button>
    </div></div>`));
}

function openGuide(key, keep){
  if (!keep) stack.length = 0;
  const g = G[key];
  push(g.always119 ? () => screen119(g, true) : () => screenCheck(g));
}

/* 1단계: 위험 신호 확인 */
function ynButtons(yes, no){ return `<div class="yn"><button class="btn btn-red" onclick="${yes}">있어요</button><button class="btn btn-green" onclick="${no}">없어요</button></div>`; }
function alertRow(title){
  const t = esc(title);
  return `<div class="calls">
    <button class="call" onclick="notify('chief', '${t} 도움이 필요해요. 와 주세요.')">이장님<small>알리기</small></button>
    <button class="call" onclick="notify('family', '${t} 119에 연락하고 있어요.')">가족<small>알리기</small></button>
    <button class="call" onclick="notify('clinic', '${t} 119에 연락하고 있어요.')">보건진료소<small>알리기</small></button>
  </div>`;
}
function screenCheck(g){
  let extra = '';
  if (g === G.bee && me.allergy.has('벌'))

let rec;
function startVoice(keep){
  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;

function listen(){
  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
  rec = new Speech(); rec.lang='ko-KR'; rec.interimResults=false; rec.continuous=false;
  show(`
    <h1>듣고 있어요</h1>

    <button class="btn btn-white btn-big" onclick="rec&&rec.abort();openWrite('',true)">그만하고 글로 설명하기</button>
  `);
  let got = false;
  const redraw = () => { if (stack.length) stack[stack.length-1](); };
  rec.onresult = e => { got = true; confirmHeard(e.results[0][0].transcript); };
  rec.onerror = () => { if (!got){ toast('잘 듣지 못했어요. 다시 해 주세요'); redraw(); } };
  rec.onend = () => { if (!got && !$('flow').hidden && $('flowBody').textContent.includes('듣고 있어요')) redraw(); };
  try { rec.start(); } catch(e){ toast('글로 적어 주세요'); openWrite(); }
}

const DEFAULT_POS = { lat:37.2585, lng:126.3105, label:'자월도 부근(기본 위치)' };
/* 카카오맵 분류(category_name)로 실제 기관만 남겨요. 이름에 '보건소'가 들어간 카페('○○ 보건소점')나

const CAT = (p, pre) => (p.category_name || '').startsWith(pre);
const DEPT = /클리닉|대응센터|화장실|주차|정류장|교차로|앞$|\(.*예정\)/;
const SUBDEPT = /(과|실|팀|계)$/;   // 보건소 안의 부서(보건행정과·방사선실 등)
const GROUPS = [

    ok:p => CAT(p, '의료,건강 > 보건소') && !DEPT.test(p.place_name) && !SUBDEPT.test(p.place_name) },
  { key:'er', title:'응급실', kws:['응급실','응급의료센터'], max:2,

  { key:'pharm', title:'약국', cat:'PM9', max:2,

function distKm(a, b){
  const R = 6371, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function fmtDist(d){ return d < 1 ? Math.round(d*1000) + 'm' : (d < 10 ? d.toFixed(1) : Math.round(d)) + 'km'; }
function setMapMsg(html, tone){

function loadKakao(ok, fail){
  if (window.kakao && kakao.maps && kakao.maps.services) { kakao.maps.load(ok); return; }
  if (window.kakao && kakao.maps && kakao.maps.load && !document.querySelector('script[data-kakao]')) { kakao.maps.load(ok); return; }
  if (!KAKAO_JS_KEY) { fail('카카오 JavaScript 키가 아직 들어가 있지 않아요.'); return; }
  if (location.protocol === 'file:') { fail('파일로 열면 지도가 뜨지 않아요. 등록한 주소에서 열어 주세요.'); return; }
  const s = document.createElement('script');
  s.dataset.kakao = '1';
  s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(KAKAO_JS_KEY)}&libraries=services&autoload=false`;
  s.onload = () => (window.kakao && kakao.maps) ? kakao.maps.load(ok) : fail('키나 등록한 주소를 확인해 주세요.');
  s.onerror = () => fail('인터넷 연결, 등록한 주소, 카카오맵 사용 설정(ON)을 확인해 주세요.');
  document.head.appendChild(s);
}

function findMe(){
  if (!kmap) return;
  setMapMsg('내 위치를 찾고 있어요…');
  if (!navigator.geolocation) { useDefault('이 기기에서는 위치를 찾을 수 없어요.'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    searchAround(myPos, '내 위치');
  }, () => useDefault('위치를 찾지 못했어요. 위치 권한을 켜면 내 주변으로 찾아 드려요.'),
  { enableHighAccuracy:true, timeout:10000, maximumAge:60000 });
}
function useDefault(why){ searchAround(DEFAULT_POS, DEFAULT_POS.label, why); }
function searchHere(){
  if (!kmap) return;
  const c = kmap.getCenter();
  searchAround({ lat: c.getLat(), lng: c.getLng() }, '지도 가운데');
}

function kSearch(ps, type, q, loc, radius){
  return new Promise(done => {
    const S = kakao.maps.services;
    const opt = { location: loc, sort: S.SortBy.DISTANCE, size: 15 };
    if (radius) opt.radius = radius;
    const cb = (data, status) => done(status === S.Status.OK ? data : []);
    try { type === 'cat' ? ps.categorySearch(q, cb, opt) : ps.keywordSearch(q, cb, opt); }
    catch (e) { done([]); }
  });
}
function pickGroup(g, list, c){
  const seen = new Set(), out = [];
  list.forEach(p => {
    if (seen.has(p.id) || (g.ok && !g.ok(p))) return;
    seen.add(p.id);
    const q = { id:p.id, gkey:g.key, kind:g.title, name:p.place_name, tel:p.phone || '',
      addr:p.road_address_name || p.address_name || '', lat:+p.y, lng:+p.x };
    q.d = distKm(c, q);
    if (q.d <= FAR_KM) out.push(q);
  });
  return out.sort((a, b) => a.d - b.d).slice(0, g.max);
}
async function findGroup(ps, g, loc, c){
  const run = async radius => {
    const jobs = [];
    if (g.cat) jobs.push(kSearch(ps, 'cat', g.cat, loc, 20000));
    (g.kws || []).forEach(k => jobs.push(kSearch(ps, 'kw', k, loc, radius)));
    return (await Promise.all(jobs)).flat();
  };
  let picked = pickGroup(g, await run(20000), c);          // 반경 20km 안에서 먼저
  if (!picked.length && g.kws) picked = pickGroup(g, await run(0), c);   // 없으면 더 넓게
  return picked;
}
async function searchAround(c, label, why){
  const seq = ++searchSeq;
  setMapMsg(`${why ? why + '<br>' : ''}<b>${esc(label)}</b> 주변을 찾고 있어요…`, why ? 'amber' : '');
  $('placeList').innerHTML = '';
  const ps = new kakao.maps.services.Places();
  const loc = new kakao.maps.LatLng(c.lat, c.lng);
  const res = await Promise.all(GROUPS.map(g => findGroup(ps, g, loc, c)));
  if (seq !== searchSeq || !$('placeList')) return;      // 그 사이 다시 찾았거나 화면을 나갔으면 무시
  found = res; placeById = {}; res.flat().forEach(p => placeById[p.id] = p);
  const total = res.reduce((n, g) => n + g.length, 0);
  setMapMsg(`${why ? why + '<br>' : ''}<b>${esc(label)}</b> 기준 가까운 순서예요.`, why ? 'amber' : '');
  if (total) refreshPlaceList(); else $('placeList').innerHTML = `<div class="box box-amber"><b>주변에서 찾지 못했어요.</b><br>지도를 손가락으로 옮긴 뒤 "지도 가운데에서 찾기"를 눌러 보세요.</div>`;
  drawMarkers(c, label);
}
function isMyClinic(p){ return p.tel && digits(p.tel) === digits(contacts.clinic.tel); }
function placeCard(p){
  const to = `https://map.kakao.com/link/to/${encodeURIComponent(p.name)},${p.lat},${p.lng}`;
  const call = p.tel ? `<a class="btn btn-green" href="tel:${esc(digits(p.tel))}">전화</a>` : '';
  const g = GROUPS.find(x => x.key === p.gkey);
  let save = '';
  if (g && g.canSave && p.tel) save = isMyClinic(p)
    ? `<div class="saved">내 보건진료소예요</div>`
    : `<button class="btn btn-amber savebtn" onclick="saveAsClinic('${esc(p.id)}')">내 보건진료소로 등록</button>`;
  return `<div class="place">
    <b>${esc(p.name)}</b>
    <div class="meta">약 ${fmtDist(p.d)} · ${p.tel ? esc(p.tel) : '전화번호 정보 없음'}<br>${esc(p.addr)}</div>
    <div class="two"${call ? '' : ' style="grid-template-columns:1fr"'}>
      ${call}<a class="btn btn-white" href="${to}" target="_blank" rel="noopener">길찾기</a>
    </div>
    ${save}
  </div>`;
}
/* 찾은 보건 기관을 '전화할 곳 > 보건진료소'에 바로 저장해요. 이미 다른 번호가 있으면 한 번 물어봐요. */
function saveAsClinic(id){
  const p = placeById[id]; if (!p) return;
  const c = contacts.clinic;
  if (c.tel && digits(c.tel) !== digits(p.tel)) {
    push(() => show(`<div class="fit">
      <h1>보건진료소 번호를 바꿀까요?</h1>
      <div class="box box-amber"><b>지금 저장된 곳</b><br>${esc(c.name)} · ${esc(prettyTel(c.tel))}</div>
      <div class="box box-green"><b>새로 등록할 곳</b><br>${esc(p.name)} · ${esc(prettyTel(p.tel))}</div>
      <div class="pair grow">
        <button class="btn btn-green" onclick="doSaveClinic('${esc(id)}'); back()">바꾸기</button>
        <button class="btn btn-white" onclick="back()">그대로 두기</button>
      </div></div>`));
    return;
  }
  doSaveClinic(id);
}
function doSaveClinic(id){
  const p = placeById[id]; if (!p) return;
  contacts.clinic.name = p.name; contacts.clinic.tel = digits(p.tel);
  saveContacts(); renderContacts();
  refreshPlaceList();
  toast('보건진료소 번호로 저장했어요: ' + p.name);
}
function refreshPlaceList(){
  const el = $('placeList'); if (!el || !found.length) return;
  el.innerHTML = GROUPS.map((g, i) => found[i] && found[i].length ? `<h2>${g.title}</h2>` + found[i].map(placeCard).join('') : '').join('');
}
function drawMarkers(c, label){
  if (!kmap || !$('map')) return;
  kmarks.forEach(m => m.setMap(null)); kmarks = [];
  const bounds = new kakao.maps.LatLngBounds();
  const cpos = new kakao.maps.LatLng(c.lat, c.lng);
  kmarks.push(new kakao.maps.CustomOverlay({ map: kmap, position: cpos, content: `<div class="ov me">${esc(label === '내 위치' ? '내 위치' : '찾은 곳')}</div>` }));
  bounds.extend(cpos);
  GROUPS.forEach((g, i) => (found[i] || []).forEach(p => {
    const pos = new kakao.maps.LatLng(p.lat, p.lng);
    kmarks.push(new kakao.maps.Marker({ map: kmap, position: pos, title: p.name }));
    if (g.label) kmarks.push(new kakao.maps.CustomOverlay({ map: kmap, position: pos, yAnchor: 2.4, content: `<div class="ov">${esc(p.name)}</div>` }));
    bounds.extend(pos);
  }));
  if (kmarks.length > 1) kmap.setBounds(bounds); else kmap.setCenter(cpos);
}

/* ---------- 배 끊김 예보 (기상청 중기해상예보, 공공데이터포털) ----------
   서해중부 해상의 4~10일 뒤 예상 파고를 받아 와요.
   판단 기준은 단순화한 것이에요: 최고 파고 3m 이상(풍랑주의보 수준) = 가능성 높음, 2.5m 이상 = 주의.
   실제 운항 통제는 운항관리센터가 결정해요. */
const KMA_KEY = '1ab929c591ae3be169284e11719cd27128afc548509d961acfbc736287c907a5';
const SEA_REG = '12A20000';   // 서해중부
const SEA_HIGH = 3.0, SEA_WARN = 2.5;
function kstNow(){ return new Date(Date.now() + 9 * 3600000); }           // UTC 메서드로 읽으면 한국 시각
function ymd(d){ return d.getUTCFullYear() + String(d.getUTCMonth()+1).padStart(2,'0') + String(d.getUTCDate()).padStart(2,'0'); }
function seaIssues(){                      // 최근 발표 시각 2개 (06시, 18시 발표)
  const n = kstNow(), h = n.getUTCHours(), day = x => new Date(n.getTime() - x * 86400000);
  if (h >= 18) return [ymd(n) + '1800', ymd(n) + '0600'];
  if (h >= 6)  return [ymd(n) + '0600', ymd(day(1)) + '1800'];
  return [ymd(day(1)) + '1800', ymd(day(1)) + '0600'];
}
async function fetchSea(tmFc){
  const u = `https://apis.data.go.kr/1360000/MidFcstInfoService/getMidSeaFcst?serviceKey=${KMA_KEY}&numOfRows=10&pageNo=1&dataType=JSON&regId=${SEA_REG}&tmFc=${tmFc}`;
  const j = await (await fetch(u)).json();
  const it = j && j.response && j.response.body && j.response.body.items && j.response.body.items.item;
  if (!it || !it[0]) throw new Error('no data');
  return it[0];
}
function seaDays(item, tmFc){
  const base = Date.UTC(+tmFc.slice(0,4), +tmFc.slice(4,6) - 1, +tmFc.slice(6,8));
  const days = [];
  for (let n = 3; n <= 10; n++){
    const vals = [item['wh'+n+'BAm'], item['wh'+n+'BPm'], item['wh'+n+'B']].map(Number).filter(v => v > 0);
    if (!vals.length) continue;
    days.push({ date: new Date(base + n * 86400000), max: Math.max(...vals), wf: item['wf'+n+'Pm'] || item['wf'+n] || '' });
  }
  return days;
}
function dayName(d){
  const today = Date.UTC(kstNow().getUTCFullYear(), kstNow().getUTCMonth(), kstNow().getUTCDate());
  const diff = Math.round((d.getTime() - today) / 86400000);
  const w = '일월화수목금토'[d.getUTCDay()] + '요일';
  return `${d.getUTCMonth()+1}월 ${d.getUTCDate()}일 ${w}` + (diff > 0 ? ` (${diff}일 뒤)` : '');
}
function renderSea(days, tmFc){
  const el = $('seaBox'); if (!el) return;
  const today = Date.UTC(kstNow().getUTCFullYear(), kstNow().getUTCMonth(), kstNow().getUTCDate());
  days = days.filter(d => d.date.getTime() >= today);
  const src = `<span class="seasrc">기상청 중기해상예보 · 서해중부 · ${+tmFc.slice(4,6)}월 ${+tmFc.slice(6,8)}일 ${+tmFc.slice(8,10)}시 발표</span>`;
  const risky = days.filter(d => d.max >= SEA_WARN);
  if (!days.length) { el.className = 'box box-amber'; el.innerHTML = `<b>배 예보를 불러오지 못했어요</b><br>${src}`; return; }
  if (!risky.length) {
    const a = days[0].date, b = days[days.length-1].date;
    el.className = 'box box-green';
    el.innerHTML = `<b>큰 파도 예보는 없어요</b><br>${a.getUTCMonth()+1}월 ${a.getUTCDate()}일부터 ${b.getUTCMonth()+1}월 ${b.getUTCDate()}일까지 예보예요. 바다 날씨는 바뀔 수 있어요.<br>${src}`;
    return;
  }
  const high = risky.some(d => d.max >= SEA_HIGH);
  el.className = 'box ' + (high ? 'box-red' : 'box-amber');
  el.innerHTML = `<b>${high ? '배가 끊길 가능성이 높아요' : '배가 끊길 수 있어요'}</b>
    <ul>${risky.slice(0,3).map(d => `<li>${dayName(d.date)} · 파도 최고 ${d.max.toFixed(1)}m</li>`).join('')}</ul>
    약이 그때까지 남아 있는지 보시고, 모자라면 보건진료소에 미리 말씀하세요.<br>${src}`;
}
async function loadSea(){
  const el = $('seaBox'); if (!el) return;
  const issues = seaIssues();
  try {                                         // 같은 발표분은 다시 받지 않아요
    const c = JSON.parse(localStorage.getItem('gyeote_sea_v1') || 'null');
    if (c && c.tmFc === issues[0]) { renderSea(seaDays(c.item, c.tmFc), c.tmFc); return; }
  } catch (e) {}
  for (const tmFc of issues){
    try {
      const item = await fetchSea(tmFc);
      try { localStorage.setItem('gyeote_sea_v1', JSON.stringify({ tmFc, item })); } catch (e) {}
      renderSea(seaDays(item, tmFc), tmFc);
      return;
    } catch (e) {}
  }
  el.className = 'box box-amber';
  el.innerHTML = '<b>배 예보를 불러오지 못했어요</b><br>인터넷 연결을 확인해 주세요. 여객선 운항은 선사나 운항관리센터에 물어보세요.';
}
loadSea();

/* ---------- 약 먹기 ---------- */
const meds = [
  { when:'아침 8시', name:'혈압약 1알 · 식후', taken:null },
  { when:'아침 8시', name:'당뇨약 1알 · 식후', taken:null },
  { when:'저녁 6시', name:'당뇨약 1알 · 식후', taken:null }
];
function renderMeds(){
  const i = meds.findIndex(m => !m.taken);
  $('nextMed').innerHTML = i < 0
    ? `<div class="nextmed"><div class="t">오늘 약을 다 드셨어요</div></div>`
    : `<div class="nextmed"><div class="t"><small>다음 약 · ${esc(meds[i].when)}</small>${esc(meds[i].name.split(' · ')[0])}</div><button onclick="takeMed(${i})">먹었어요</button></div>`;
  $('medList').innerHTML = meds.map((m,i) => `
    <div class="med${m.taken?' done':''}">
      <div class="when">${esc(m.when)}</div>
      <div class="name">${esc(m.name)}</div>
      ${m.taken
        ? `<button class="btn" disabled>✓ ${esc(m.taken)}에 드셨어요</button>`
        : `<button class="btn btn-green" onclick="takeMed(${i})">먹었어요</button>`}
    </div>`).join('');
}
function takeMed(i){
  const d = new Date();
  meds[i].taken = `${d.getHours()}시 ${String(d.getMinutes()).padStart(2,'0')}분`;
  renderMeds(); toast('드신 것으로 기록했어요');
}
let newSlot = '';
function openAddMed(){
  stack.length = 0; newSlot = '';
  const slots = ['아침 8시','점심 12시','저녁 6시','자기 전 9시'];
  push(() => show(`
    <h1>약 추가하기</h1>
    <label class="field" for="medName">약 이름</label>
    <input id="medName" type="text" maxlength="40" placeholder="예: 혈압약" aria-describedby="medErr">
    <p class="err" id="medErr" role="alert"></p>
    <p class="field" style="font-weight:800;margin:22px 0 10px">언제 드세요?</p>
    <div class="chips" id="slotChips">${slots.map(s=>`<button class="chip" aria-pressed="false" onclick="pickSlot(this,'${s}')">${s}</button>`).join('')}</div>
    <button class="btn btn-green btn-big" style="margin-top:24px" onclick="saveMed()">추가하기</button>
  `));
}
function pickSlot(el, s){
  document.querySelectorAll('#slotChips .chip').forEach(c => c.setAttribute('aria-pressed','false'));
  el.setAttribute('aria-pressed','true'); newSlot = s;
}
function saveMed(){
  const name = $('medName').value.trim();
  if (!name){ $('medErr').textContent = '약 이름을 적어 주세요.'; $('medName').focus(); return; }
  if (!newSlot){ $('medErr').textContent = '언제 드시는지 아래에서 골라 주세요.'; return; }
  meds.push({ when:newSlot, name, taken:null }); renderMeds(); closeFlow(); go('me'); toast('약을 추가했어요');
}
renderMeds();
renderContacts();
document.body.dataset.page = 'help';

document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('flow').hidden) back(); });
</script>
